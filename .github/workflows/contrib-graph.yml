name: Refresh profile

on:
  schedule:
    # Twice a day so "latest pushes" never reads as day-old news.
    # 03:17 UTC ≈ 08:47 IST (morning), 15:17 UTC ≈ 20:47 IST (evening).
    - cron: "17 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/contrib-graph.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CONTRIB_TOKEN is optional. The contribution calendar is public data, so a
      # plain token reads it fine; set the secret only if the default one ever
      # stops working. Neither script fails the run when the API is unreachable —
      # they leave yesterday's output in place and warn.
      - name: Merge contribution graphs
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/contrib_graph.py

      - name: Refresh README blocks
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/refresh_readme.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/ README.md; then
            echo "Nothing changed today."
            exit 0
          fi
          git add assets/ README.md
          git commit -m "chore: refresh profile [skip ci]"
          git push
